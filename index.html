<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0F2340" />
<meta name="apple-mobile-web-app-title" content="Aggies Pong" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png" />
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="apple-touch-icon.png" />
<title>Aggies Pong</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    background: rgba(0,0,0,0.7);
    pointer-events: auto;
    padding: 24px;
    gap: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 48px;
    letter-spacing: 4px;
    font-weight: 700;
  }
  #overlay p {
    font-size: 18px;
    opacity: 0.85;
    max-width: 320px;
    line-height: 1.4;
  }
  #overlay button {
    margin-top: 8px;
    padding: 14px 32px;
    font-size: 18px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
  }
  #overlay button:active { opacity: 0.7; }
  .small { font-size: 14px; opacity: 0.6; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>PONG</h1>
  <p>Drag anywhere on the bottom half of the screen to move your paddle. First to 7 wins.</p>
  <button id="startBtn">Start Game</button>
  <p class="small">Tip: add to Home Screen for full-screen play.</p>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  // Court background image
  const courtImg = new Image();
  let courtReady = false;
  courtImg.onload = () => { courtReady = true; draw(); };
  courtImg.src = 'usu_basketball_court.png';

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const state = {
    running: false,
    playerScore: 0,
    cpuScore: 0,
    winScore: 7,
    paddleW: 0, paddleH: 12,
    playerX: 0,
    cpuX: 0,
    cpuSpeed: 0,
    ball: { x: 0, y: 0, vx: 0, vy: 0, r: 8 },
    lastTime: 0,
    serveTo: 'player',
    serveDelay: 0,
    winner: null,
  };

  function resetPositions(serveDirection) {
    state.paddleW = Math.min(140, Math.max(80, W * 0.22));
    state.playerX = W / 2 - state.paddleW / 2;
    state.cpuX = W / 2 - state.paddleW / 2;
    state.ball.r = Math.max(6, Math.min(12, W * 0.022));
    state.ball.x = W / 2;
    state.ball.y = H / 2;
    const baseSpeed = Math.max(360, Math.min(560, H * 0.55));
    const angle = (Math.random() * 0.6 - 0.3);
    const dir = serveDirection === 'player' ? 1 : -1;
    state.ball.vx = Math.sin(angle) * baseSpeed;
    state.ball.vy = Math.cos(angle) * baseSpeed * dir;
    state.cpuSpeed = Math.max(280, Math.min(460, H * 0.42));
    state.serveDelay = 0.6;
  }

  function newGame() {
    state.playerScore = 0;
    state.cpuScore = 0;
    state.winner = null;
    state.serveTo = Math.random() < 0.5 ? 'player' : 'cpu';
    resetPositions(state.serveTo);
    state.running = true;
    state.lastTime = performance.now();
    overlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function endGame(winner) {
    state.running = false;
    state.winner = winner;
    overlay.querySelector('h1').textContent = winner === 'player' ? 'YOU WIN!' : 'CPU WINS';
    overlay.querySelector('p').textContent = `Final score: ${state.playerScore} – ${state.cpuScore}`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  let activePointerId = null;
  function onPointerDown(e) {
    if (!state.running) return;
    activePointerId = e.pointerId;
    movePaddleTo(e.clientX);
    e.preventDefault();
  }
  function onPointerMove(e) {
    if (!state.running) return;
    if (activePointerId !== null && e.pointerId !== activePointerId) return;
    movePaddleTo(e.clientX);
    e.preventDefault();
  }
  function onPointerUp(e) {
    if (e.pointerId === activePointerId) activePointerId = null;
  }
  function movePaddleTo(clientX) {
    const target = clientX - state.paddleW / 2;
    state.playerX = Math.max(0, Math.min(W - state.paddleW, target));
  }
  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());

  startBtn.addEventListener('click', newGame);

  function update(dt) {
    if (state.serveDelay > 0) {
      state.serveDelay -= dt;
      return;
    }

    const b = state.ball;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }

    const playerY = H - 40 - state.paddleH;
    const cpuY = 40;

    if (b.vy > 0 &&
        b.y + b.r >= playerY &&
        b.y - b.r <= playerY + state.paddleH &&
        b.x >= state.playerX &&
        b.x <= state.playerX + state.paddleW) {
      b.y = playerY - b.r;
      const hit = (b.x - (state.playerX + state.paddleW / 2)) / (state.paddleW / 2);
      const speed = Math.hypot(b.vx, b.vy) * 1.05;
      const angle = hit * (Math.PI / 3);
      b.vx = Math.sin(angle) * speed;
      b.vy = -Math.abs(Math.cos(angle) * speed);
    }

    if (b.vy < 0 &&
        b.y - b.r <= cpuY + state.paddleH &&
        b.y + b.r >= cpuY &&
        b.x >= state.cpuX &&
        b.x <= state.cpuX + state.paddleW) {
      b.y = cpuY + state.paddleH + b.r;
      const hit = (b.x - (state.cpuX + state.paddleW / 2)) / (state.paddleW / 2);
      const speed = Math.hypot(b.vx, b.vy) * 1.05;
      const angle = hit * (Math.PI / 3);
      b.vx = Math.sin(angle) * speed;
      b.vy = Math.abs(Math.cos(angle) * speed);
    }

    if (b.y - b.r > H) {
      state.cpuScore++;
      if (state.cpuScore >= state.winScore) return endGame('cpu');
      state.serveTo = 'cpu';
      resetPositions(state.serveTo);
    } else if (b.y + b.r < 0) {
      state.playerScore++;
      if (state.playerScore >= state.winScore) return endGame('player');
      state.serveTo = 'player';
      resetPositions(state.serveTo);
    }

    const cpuCenter = state.cpuX + state.paddleW / 2;
    const targetX = b.x + (b.vx * 0.15);
    const diff = targetX - cpuCenter;
    const maxStep = state.cpuSpeed * dt;
    const step = Math.max(-maxStep, Math.min(maxStep, diff));
    state.cpuX = Math.max(0, Math.min(W - state.paddleW, state.cpuX + step));
  }

  function draw() {
    // Background: court image (cover) or black fallback
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (courtReady) {
      const iw = courtImg.naturalWidth;
      const ih = courtImg.naturalHeight;
      const scale = Math.max(W / iw, H / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = (W - dw) / 2;
      const dy = (H - dh) / 2;
      ctx.drawImage(courtImg, dx, dy, dw, dh);
      // Slight dim so paddles/ball/score stay readable
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(0, H / 2);
    ctx.lineTo(W, H / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.18)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state.cpuScore, W / 2, H / 2 - H * 0.12);
    ctx.fillText(state.playerScore, W / 2, H / 2 + H * 0.12);

    // Paddles — outlined so they pop against the court
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 2;
    const playerY = H - 40 - state.paddleH;
    const cpuY = 40;
    roundRect(state.cpuX, cpuY, state.paddleW, state.paddleH, 6, true);
    roundRect(state.playerX, playerY, state.paddleW, state.paddleH, 6, true);

    // Ball
    ctx.beginPath();
    ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.stroke();
  }

  function roundRect(x, y, w, h, r, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
    if (stroke) ctx.stroke();
  }

  function loop(now) {
    if (!state.running) return;
    const dt = Math.min(0.033, (now - state.lastTime) / 1000);
    state.lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resetPositions('player');
  draw();
})();
</script>
</body>
</html>
